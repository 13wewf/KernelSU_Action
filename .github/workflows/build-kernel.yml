name: Build Kernel
on:
  watch:
    types: [started]
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel by ${{ github.actor }}
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
    steps:
    - uses: actions/checkout@v4

    - name: Prepare Configuration
      run: |
        echo "KERNEL_SOURCE=$(grep -w "KERNEL_SOURCE" config.env | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "KERNEL_SOURCE_BRANCH=$(grep -w "KERNEL_SOURCE_BRANCH" config.env | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "KERNEL_CONFIG=$(grep -w "KERNEL_CONFIG" config.env | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "KERNEL_IMAGE_NAME=$(grep -w "KERNEL_IMAGE_NAME" config.env | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "ARCH=$(grep -w "ARCH" config.env | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "CLANG_BRANCH=$(grep -w "CLANG_BRANCH" config.env | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "CLANG_VERSION=$(grep -w "CLANG_VERSION" config.env | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "ENABLE_KERNELSU=$(grep -w "ENABLE_KERNELSU" config.env | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "ENABLE_CCACHE=$(grep -w "ENABLE_CCACHE" config.env | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "DISABLE-LTO=$(grep -w "DISABLE-LTO" config.env | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "DISABLE_CC_WERROR=$(grep -w "DISABLE_CC_WERROR" config.env | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "ADD_OVERLAYFS_CONFIG=$(grep -w "ADD_OVERLAYFS_CONFIG" config.env | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV

    - name: Set swap to 10G
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 10

    - name: Setup build kernel environment
      run: |
        echo "BUILD_TIME=$(TZ=Asia/Shanghai date "+%Y%m%d%H%M")" >> $GITHUB_ENV
        echo "DEVICE=$(echo ${{ env.KERNEL_CONFIG }} | sed 's!vendor/!!;s/_defconfig//;s/_user//;s/-perf//')" >> $GITHUB_ENV
        sudo apt-get update
        sudo apt-get install -y git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler python3 gcc-aarch64-linux-gnu
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace

    - name: Download Clang-aosp
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        mkdir clang-aosp
        wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/${{ env.CLANG_BRANCH }}/clang-${{ env.CLANG_VERSION }}.tar.gz
        tar -C clang-aosp/ -zxvf clang-${{ env.CLANG_VERSION }}.tar.gz

    - name: Download kernel source
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone ${{ env.KERNEL_SOURCE }} -b ${{ env.KERNEL_SOURCE_BRANCH }} android-kernel --depth=1

    - name: Setup ReSukiSU (Manual Hook & Auto Patch)
      if: env.ENABLE_KERNELSU == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        git clone https://github.com/Baka-SU/BakaSU.git temp_ksu
        mkdir -p drivers/KernelSU
        cp -r temp_ksu/kernel/* drivers/KernelSU/
        rm -rf temp_ksu
        
        cd drivers/KernelSU
        git init > /dev/null 2>&1
        git config user.email "ci@github.com"
        git config user.name "CI Runner"
        git add . > /dev/null 2>&1
        git commit -m "Fake submodule" --quiet > /dev/null 2>&1
        sed -i 's/\$(error/\$(info/g' Kbuild || true
        sed -i '/You should use BakaSU as a git submodule/d' Kbuild || true
        echo 'subdir-ccflags-y += -I$(srctree)/drivers/KernelSU' >> Kbuild
        
        if [ -d "uapi" ] && [ -d "preinit/runner" ]; then
            cp -r uapi preinit/runner/
        fi
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        
        echo 'source "drivers/KernelSU/Kconfig"' >> drivers/Kconfig
        echo 'obj-$(CONFIG_KSU) += KernelSU/' >> drivers/Makefile
        
        cat << 'PYEOF' > inject_hooks.py
        import os
        import re
        with open('fs/exec.c', 'r') as f: exec_c = f.read()
        if 'ksu_handle_execveat' not in exec_c:
            decl = '\n#ifdef CONFIG_KSU_MANUAL_HOOK\n__attribute__((hot))\nextern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n__attribute__((hot))\nextern int ksu_handle_post_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags, int *retval);\n#endif\n'
            exec_c = re.sub(r'(static int do_execveat_common\()', decl + r'\n\1', exec_c, count=1)
            old_body = 'return __do_execve_file(fd, filename, argv, envp, flags, NULL);'
            new_body = '\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tint retval;\n\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n\tretval = __do_execve_file(fd, filename, argv, envp, flags, NULL);\n\tksu_handle_post_execveat(&fd, &filename, &argv, &envp, &flags, &retval);\n\treturn retval;\n#else\n\treturn __do_execve_file(fd, filename, argv, envp, flags, NULL);\n#endif\n'
            exec_c = exec_c.replace(old_body, new_body)
            with open('fs/exec.c', 'w') as f: f.write(exec_c)
            
        with open('fs/open.c', 'r') as f: open_c = f.read()
        if 'ksu_handle_faccessat' not in open_c:
            decl = '\n#ifdef CONFIG_KSU_MANUAL_HOOK\n__attribute__((hot))\nextern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n#endif\n'
            open_c = re.sub(r'(SYSCALL_DEFINE3\(faccessat,)', decl + r'\n\1', open_c, count=1)
            open_c = open_c.replace('return do_faccessat(dfd, filename, mode);', '\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif\n\treturn do_faccessat(dfd, filename, mode);')
            with open('fs/open.c', 'w') as f: f.write(open_c)
            
        with open('fs/stat.c', 'r') as f: stat_c = f.read()
        if 'ksu_handle_stat' not in stat_c:
            decl = '\n#ifdef CONFIG_KSU_MANUAL_HOOK\n__attribute__((hot))\nextern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\nextern void ksu_handle_newfstat_ret(unsigned int *fd, struct stat __user **statbuf_ptr);\n#if defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_COMPAT_STAT64)\nextern void ksu_handle_fstat64_ret(unsigned long *fd, struct stat64 __user **statbuf_ptr);\n#endif\n#endif\n'
            stat_c = re.sub(r'(SYSCALL_DEFINE4\(newfstatat,)', decl + r'\n\1', stat_c, count=1)
            stat_c = stat_c.replace('error = vfs_fstatat(dfd, filename, &stat, flag);', '\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_stat(&dfd, &filename, &flag);\n#endif\n\terror = vfs_fstatat(dfd, filename, &stat, flag);')
            
            def fix_newfstat(m):
                body = m.group(0)
                if 'ksu_handle_newfstat_ret' not in body:
                    body = body.replace('return error;', '\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_newfstat_ret(&fd, &statbuf);\n#endif\n\treturn error;')
                return body
            stat_c = re.sub(r'SYSCALL_DEFINE2\(newfstat,.*?\n\}', fix_newfstat, stat_c, flags=re.DOTALL)
            
            def fix_fstat64(m):
                body = m.group(0)
                if 'ksu_handle_fstat64_ret' not in body:
                    body = body.replace('return error;', '\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_fstat64_ret(&fd, &statbuf);\n#endif\n\treturn error;')
                return body
            stat_c = re.sub(r'SYSCALL_DEFINE2\(fstat64,.*?\n\}', fix_fstat64, stat_c, flags=re.DOTALL)
            with open('fs/stat.c', 'w') as f: f.write(stat_c)
            
        with open('kernel/reboot.c', 'r') as f: reboot_c = f.read()
        if 'ksu_handle_sys_reboot' not in reboot_c:
            decl = '\n#ifdef CONFIG_KSU_MANUAL_HOOK\nextern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n#endif\n'
            reboot_c = re.sub(r'(SYSCALL_DEFINE4\(reboot,)', decl + r'\n\1', reboot_c, count=1)
            reboot_c = reboot_c.replace('if (!ns_capable(pid_ns->user_ns, CAP_SYS_BOOT))', '\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n#endif\n\tif (!ns_capable(pid_ns->user_ns, CAP_SYS_BOOT))')
            with open('kernel/reboot.c', 'w') as f: f.write(reboot_c)
        PYEOF
        python3 inject_hooks.py
        
        echo "CONFIG_KSU=y" >> arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
        echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
        echo "CONFIG_KALLSYMS_ALL=y" >> arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
        echo "CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y" >> arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
        echo "CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y" >> arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
        echo "CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK=y" >> arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
        
        echo "UPLOADNAME=-ReSukiSU" >> $GITHUB_ENV

    - name: Setup Configuration for Kernel
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        if [ ${{ env.ADD_OVERLAYFS_CONFIG }} = true ]; then
            echo "CONFIG_OVERLAY_FS=y" >> arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
        fi
        if [ ${{ env.DISABLE-LTO }} = true ]; then
            sed -i 's/CONFIG_LTO=y/CONFIG_LTO=n/' arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }} || true
            sed -i 's/CONFIG_LTO_CLANG=y/CONFIG_LTO_CLANG=n/' arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }} || true
            sed -i 's/CONFIG_THINLTO=y/CONFIG_THINLTO=n/' arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }} || true
            echo "CONFIG_LTO_NONE=y" >> arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
        fi
        if [ ${{ env.DISABLE_CC_WERROR }} = true ]; then
            echo "CONFIG_CC_WERROR=n" >> arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
        fi

    - name: Setup ccache
      if: env.ENABLE_CCACHE == 'true'
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: build-kernel-${{ env.DEVICE }}${{ env.UPLOADNAME }}
        max-size: 2G

    - name: Build kernel
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$PATH
        export KBUILD_BUILD_HOST=Github-Action
        export KBUILD_BUILD_USER=$(echo ${{ github.actor }} | tr A-Z a-z)
        
        export HOSTCC=clang
        export HOSTCXX=clang++
        export HOSTAR=llvm-ar
        export HOSTLD=ld.lld
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        make -j2 CC=clang O=out ARCH=${{ env.ARCH }} ${{ env.KERNEL_CONFIG }}
        
        # 使用 -j2 (满血2核)，如果失败输出最后100行日志
        if [ ${{ env.ENABLE_CCACHE }} = true ]; then
            make -j2 CC="ccache clang" O=out ARCH=${{ env.ARCH }} > build.log 2>&1 || (echo "==== BUILD FAILED ====" && tail -n 100 build.log && exit 1)
        else
            make -j2 CC=clang O=out ARCH=${{ env.ARCH }} > build.log 2>&1 || (echo "==== BUILD FAILED ====" && tail -n 100 build.log && exit 1)
        fi

    - name: Upload Build Log on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-failed-log
        path: kernel_workspace/android-kernel/build.log

    - name: Check a kernel output files
      if: success()
      run: |
       cd $GITHUB_WORKSPACE/kernel_workspace
       if [ -f android-kernel/out/arch/${{ env.ARCH }}/boot/${{ env.KERNEL_IMAGE_NAME }} ]; then
           echo "CHECK_FILE_IS_OK=true" >> $GITHUB_ENV
       else
           echo "Kernel output file is empty"
           exit 1
       fi

    - name: Make Anykernel3
      if: success() && env.CHECK_FILE_IS_OK == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://github.com/osm0sis/AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
        sed -i 's!block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!block=auto;!g' AnyKernel3/anykernel.sh
        sed -i 's/is_slot_device=0;/is_slot_device=auto;/g' AnyKernel3/anykernel.sh
        cp android-kernel/out/arch/${{ env.ARCH }}/boot/${{ env.KERNEL_IMAGE_NAME }} AnyKernel3/
        rm -rf AnyKernel3/.git* AnyKernel3/README.md

    - name: Upload AnyKernel3
      if: success() && env.CHECK_FILE_IS_OK == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: AnyKernel3${{ env.UPLOADNAME }}-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
        path: kernel_workspace/AnyKernel3/*
