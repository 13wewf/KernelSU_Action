name: Build Kernel
on:
  watch:
    types: [started]
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel by ${{ github.actor }}
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
    steps:
    - uses: actions/checkout@v4

    - name: Prepare Configuration
      run: |
        echo "KERNEL_SOURCE=$(grep -w "KERNEL_SOURCE" config.env | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "KERNEL_SOURCE_BRANCH=$(grep -w "KERNEL_SOURCE_BRANCH" config.env | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "KERNEL_CONFIG=$(grep -w "KERNEL_CONFIG" config.env | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "KERNEL_IMAGE_NAME=$(grep -w "KERNEL_IMAGE_NAME" config.env | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "ARCH=$(grep -w "ARCH" config.env | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "CLANG_BRANCH=$(grep -w "CLANG_BRANCH" config.env | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "CLANG_VERSION=$(grep -w "CLANG_VERSION" config.env | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "KSU_VARIANT=$(grep -w "KSU_VARIANT" config.env | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "KSU_MANUAL_HOOK=$(grep -w "KSU_MANUAL_HOOK" config.env | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "EXTRA_DEFCONFIG=$(grep -w "EXTRA_DEFCONFIG" config.env | head -n 1 | cut -d "=" -f 2 | tr -d '"')" >> $GITHUB_ENV

    - name: Set swap to 10G
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 10

    - name: Setup build kernel environment
      run: |
        sudo apt-get update
        sudo apt-get install -y git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler python3 gcc-aarch64-linux-gnu
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace

    - name: Download Clang-aosp
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        mkdir clang-aosp
        wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/${{ env.CLANG_BRANCH }}/clang-${{ env.CLANG_VERSION }}.tar.gz
        tar -C clang-aosp/ -zxvf clang-${{ env.CLANG_VERSION }}.tar.gz

    - name: Download kernel source
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone ${{ env.KERNEL_SOURCE }} -b ${{ env.KERNEL_SOURCE_BRANCH }} android-kernel --depth=1

    - name: Setup Official KernelSU
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        # 官方标准脚本，自动处理 Hook
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
        
        # 强制写入必要的内核配置
        echo "CONFIG_KSU=y" >> arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
        echo "CONFIG_KALLSYMS_ALL=y" >> arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
        
        # 判断如果是 4.19 内核，强制开启手动 Hook
        if [ "${{ env.KSU_MANUAL_HOOK }}" = "true" ]; then
            echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
        fi
        
        # 注入额外配置
        if [ -n "${{ env.EXTRA_DEFCONFIG }}" ]; then
            for config in ${{ env.EXTRA_DEFCONFIG }}; do
                echo "$config" >> arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
            done
        fi

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: build-kernel-${{ env.KERNEL_CONFIG }}
        max-size: 2G

    - name: Build kernel
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$PATH
        export KBUILD_BUILD_HOST=Github-Action
        export KBUILD_BUILD_USER=$(echo ${{ github.actor }} | tr A-Z a-z)
        
        export HOSTCC=clang
        export HOSTCXX=clang++
        export HOSTAR=llvm-ar
        export HOSTLD=ld.lld
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        make -j2 CC="ccache clang" O=out ARCH=${{ env.ARCH }} ${{ env.KERNEL_CONFIG }}
        make -j2 CC="ccache clang" O=out ARCH=${{ env.ARCH }} > build.log 2>&1 || (echo "==== BUILD FAILED ====" && tail -n 100 build.log && exit 1)

    - name: Upload Build Log on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-failed-log
        path: kernel_workspace/android-kernel/build.log

    - name: Make Anykernel3
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://github.com/osm0sis/AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
        sed -i 's!block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!block=auto;!g' AnyKernel3/anykernel.sh
        sed -i 's/is_slot_device=0;/is_slot_device=auto;/g' AnyKernel3/anykernel.sh
        cp android-kernel/out/arch/${{ env.ARCH }}/boot/${{ env.KERNEL_IMAGE_NAME }} AnyKernel3/
        rm -rf AnyKernel3/.git* AnyKernel3/README.md

    - name: Upload AnyKernel3
      uses: actions/upload-artifact@v4
      with:
        name: AnyKernel3-OfficialKernelSU-${{ env.KERNEL_CONFIG }}
        path: kernel_workspace/AnyKernel3/*
